spring:
  application:
    name: Match

  datasource:
    url: jdbc:postgresql://localhost:5432/match_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

security:
  jwt:
